{
  "[assumptions]" : "This token appears in templates for tactics that may use assumptions from the proof state given in *Hypothesis And Goals Before Tactic Application*. Replace it with a explanation or a mathematical reference to each assumption used.If multiple theorems are used, include explanations for all of them.",
  "[theorems]" : "This token appears in templates for tactics that may use definitions or theorems listed in *Using Definitions and Theorems*. Replace it with a explanation or a mathematical reference to each definition or theorem used. If multiple theorems are used, include explanations for all of them.",
  "[hypothesisBefore]" : "This token appears in templates for tactics that need to refer to assumptions in the proof state before applying the tactic. Replace it with a explanation or a mathematical reference to the relevant assumptions before the tactic is applied.",
  "[hypothesisAfter]" : "This token appears in templates for tactics that need to refer to assumptions in the proof state after applying the tactic. Replace it with a explanation or a mathematical reference to the relevant assumptions after the tactic is applied.",
  "[goalsBefore]" : "This token appears in templates for tactics that need to refer to goals in the proof state before applying the tactic. Replace it with a explanation or a mathematical reference to the relevant goals before the tactic is applied.",
  "[goalsAfter]" : "This token appears in templates for tactics that need to refer to goals in the proof state after applying the tactic. Replace it with a explanation or a mathematical reference to the relevant goals after the tactic is applied.",
  "[newVariable]" : "This token appears in templates for tactics that introduce new variables into hypotheses. Replace it with the newly introduced variables by comparing Hypothesis And Goals Before Tactic Application with Hypothesis And Goals After Tactic Application. Note that a “variable” here is one that has a simple type.(This does not include variables that name hypotheses about an expression, such as \\( h : r = a + b\\).)",
  "[newVariableCondition]" : "This token appears in templates for tactics that introduce new variables into the hypotheses. Replace it with a explanation or a mathematical reference that describes the state of the newly introduced variable by comparing Hypothesis And Goals Before Tactic Application with Hypothesis And Goals After Tactic Application.",
  "[statement]" : "This token appears in templates for a tactic that provides a proposition (subgoal) to be proven. Replace it with a explanation or a mathematical reference to the relevant proposition by checking the Applied Tactic.",
  "[proof]" : "This token appears in templates for a tactic that simultaneously provides a proposition (subgoal) to be proven and its proof. Replace it with a explanation of a proof to the relevant proof by checking the Applied Tactic. Additionally, if any theorems listed in Using Definitions and Theorems are used, be sure to include an explanation or a mathematical reference of those theorems in the text. If multiple theorems are used, include explanations for all of them.",
  "[existingVariable]" : "This token appears in templates for tactic  that reference existing variables. Replace it with the name of the existing variable referenced in the tactic.",
  "[caseCondition]" : "This token appears in templates for tactic that focus on a specific case in a case analysis. Compare *Hypothesis And Goals Before Tactic Application* and *Hypothesis And Goals After Tactic Application*, and replace it with the case condition highlighted in *Hypothesis And Goals After Tactic Application*.\n\nFor example, consider the following state transition:\n\n```\n[goalsBefore]\ncase inl\n...\nh : a > 0\n...\ncase inr\n...\nh : a ≤ 0\n...\n↓\n[goalsAfter]\ncase inl\n...\nh : a > 0\n...\n\n```\n\nIn this case, the output should be:\n\nWe prove the case where \\( a > 0 \\).",
  "[conflictingExpressions]" : "This token appears in tactic templates that demonstrate a contradiction between propositions within the assumptions or between an assumption and the proof goal. Check *Hypothesis And Goals Before Tactic Application*, extract the two or more conflicting propositions, and replace it with a brief explanation or a mathematical reference formatted in TeX to the contradictory expressions.",
  "[calcStep]" : "This token appears in tactic templates that prove a proposition through multiple calculation steps. Replace it with the full sequence of intermediate expressions formatted in TeX.\n\nFor example, consider the following calculation:\n\n```\ncalc\n    a = b + 1 := ...\n    _ = c + 1 := ...\n  _ ≤ d + 1 := ...\n\n```\n\nIn this case, the output should be:\n\nBy calculation, it is shown that \\( a = b + 1 = c + 1 \\leq d + 1. \\)"
}